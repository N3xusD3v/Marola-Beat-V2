# Compose file usado pelo Coolify para build/deploy do bot + painel web + Lavalink.
# Não defina `ports:` no serviço `bot` — o domínio é atribuído pela UI do Coolify
# apontando para a porta interna 3000 (ex: https://beat.n3xus.dev:3000). O Lavalink não é
# exposto ao host: só o serviço `bot` fala com ele, pela rede interna do compose.
# Veja DEPLOYMENT.md para o passo a passo completo.
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      lavalink:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_APP_ID: ${DISCORD_APP_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      GUILD_ID: ${GUILD_ID:-}
      WEB_GUILD_ID: ${WEB_GUILD_ID}
      PUBLIC_URL: ${PUBLIC_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LAVALINK_HOST: lavalink
      LAVALINK_PORT: 2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD}

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    restart: unless-stopped
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD}
      SERVER_PORT: 2333
      # Nome exigido pelo relaxed-binding do Spring Boot para plugins.youtube.oauth.refreshToken —
      # esse valor NÃO pode vir de um placeholder `${...}` dentro de application.yml (ver nota lá).
      PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN: ${YOUTUBE_OAUTH_REFRESH_TOKEN}
      # Meta de pausa do G1GC mais curta (padrão é 200ms) — pausas de GC mais curtas e frequentes
      # em vez de mais longas e raras tendem a ser menos perceptíveis em áudio em tempo real.
      _JAVA_OPTIONS: '-XX:MaxGCPauseMillis=100'
    volumes:
      # Sem volume nomeado para /opt/Lavalink/plugins de propósito: o container roda como usuário
      # não-root e um volume nomeado do Docker nasce com dono root, o que quebra o download do
      # plugin de YouTube na inicialização com "Permission denied" (visto rodando localmente).
      # O plugin (poucos MB) é baixado de novo a cada start — mais simples que lidar com uid/gid.
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    expose:
      - '2333'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-qO-',
          '--header=Authorization: ${LAVALINK_PASSWORD}',
          'http://localhost:2333/version',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Store da sessão do painel web (substitui o MemoryStore padrão do express-session, que perde
  # tudo a cada redeploy e não escala além de um processo — ver DEPLOYMENT.md). Não exposto ao
  # host, de propósito: só o serviço `bot` fala com ele, pela rede interna do compose.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1
    volumes:
      - redis-data:/data
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', '--no-auth-warning', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  redis-data:
