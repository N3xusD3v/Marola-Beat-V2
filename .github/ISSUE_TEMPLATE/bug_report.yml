name: 🐛 Reportar bug
description: Algo não está funcionando como esperado
labels: ['bug', 'triage']
body:
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o bug de forma clara.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Rode `/play <link>`
        2. Rode `/skip`
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: Cole os logs do bot (NUNCA inclua o `DISCORD_TOKEN` ou outros segredos).
      render: shell

  - type: input
    id: version
    attributes:
      label: Versão do bot / commit
      placeholder: v2.0.0 ou hash do commit

  - type: dropdown
    id: environment
    attributes:
      label: Onde está rodando?
      options:
        - Produção (Coolify)
        - Desenvolvimento local
        - Outro
