# Rota alternativa de deploy: builda e publica a imagem no GHCR, depois aciona o
# webhook de deploy do Coolify. Só roda se os secrets abaixo estiverem configurados
# (Settings > Secrets and variables > Actions). Se você usa a integração nativa do
# Coolify com o GitHub (recomendada, veja DEPLOYMENT.md), este workflow é opcional
# e pode ficar desativado/ignorado.
name: Deploy (GHCR + Coolify webhook)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build image & trigger Coolify
    runs-on: ubuntu-latest
    # Só roda se os secrets de deploy existirem, para não falhar em forks/PRs.
    if: ${{ github.repository_owner == 'N3xusD3v' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Acionar deploy no Coolify
        if: ${{ secrets.COOLIFY_WEBHOOK != '' }}
        run: |
          curl --fail --request GET "${{ secrets.COOLIFY_WEBHOOK }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
