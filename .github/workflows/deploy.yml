# Rota alternativa de deploy: builda e publica a imagem no GHCR, depois aciona o
# webhook de deploy do Coolify. Só roda se os secrets abaixo estiverem configurados
# (Settings > Secrets and variables > Actions). Se você usa a integração nativa do
# Coolify com o GitHub (recomendada, veja DEPLOYMENT.md), este workflow é opcional
# e pode ficar desativado/ignorado.
name: Deploy (GHCR + Coolify webhook)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: Build image & trigger Coolify
    runs-on: ubuntu-latest
    # Só roda se os secrets de deploy existirem, para não falhar em forks/PRs.
    if: ${{ github.repository_owner == 'N3xusD3v' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Nome da imagem em minúsculas
        # Tags do Docker exigem minúsculas; github.repository preserva a caixa do nome do repo,
        # e a sintaxe de expressões do Actions não tem uma função toLower().
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Acionar deploy no Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "COOLIFY_WEBHOOK não configurado (Settings > Secrets and variables > Actions) — pulando."
            exit 0
          fi
          curl --fail --request GET "$COOLIFY_WEBHOOK" --header "Authorization: Bearer $COOLIFY_TOKEN"
