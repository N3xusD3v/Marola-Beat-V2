# Config do node Lavalink usado pelo bot (via lavalink-client). Só é acessível dentro da rede
# interna do Docker Compose — não expõe porta pro host, veja docker-compose.yml.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: '${LAVALINK_SERVER_PASSWORD}'
    sources:
      # YouTube é servido pelo plugin abaixo, não pela fonte nativa (removida do Lavalink 4
      # por causa de bloqueios de assinatura do próprio YouTube — ver plugins.youtube).
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: false
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
  plugins:
    - dependency: 'dev.lavalink.youtube:youtube-plugin:1.18.2'
      snapshot: false

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ''

logging:
  level:
    root: INFO
    lavalink: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 5
