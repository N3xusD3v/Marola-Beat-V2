# Config do node Lavalink usado pelo bot (via lavalink-client). Só é acessível dentro da rede
# interna do Docker Compose — não expõe porta pro host, veja docker-compose.yml.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: '${LAVALINK_SERVER_PASSWORD}'
    sources:
      # YouTube é servido pelo plugin abaixo, não pela fonte nativa (removida do Lavalink 4
      # por causa de bloqueios de assinatura do próprio YouTube — ver plugins.youtube).
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: false
      local: false
    # bufferDurationMs mais alto que o padrão (400) dá mais margem contra picos de latência de
    # agendamento da CPU — o host roda vários outros stacks Docker além deste, então contenção de
    # CPU é esperada. opusEncodingQuality abaixo do máximo (10) reduz o custo de CPU por frame de
    # áudio codificado (perda de qualidade imperceptível nesse nível, já que a saída do Discord é
    # comprimida de qualquer forma). nonAllocatingFrameBuffer reduz alocações por frame, o que
    # reduz pressão de GC — outra fonte comum de stutter em áudio em tempo real.
    bufferDurationMs: 1000
    opusEncodingQuality: 8
    nonAllocatingFrameBuffer: true
    frameBufferDurationMs: 5000
    # Limite de faixas carregadas de playlists (padrão 6) — para uso privado, pode ser maior
    youtubePlaylistLoadLimit: 20
    playerUpdateInterval: 5
    # Desativado (28/ago/2026) — ver plugins.youtube.enabled abaixo. Confirmado em produção que
    # TODOS os clients configurados (TV, MUSIC, WEB) falham ao carregar qualquer faixa com
    # AllClientsFailedException ("The page needs to be reloaded" / "No supported audio streams
    # available") — bug upstream aberto sem correção (lavalink-devs/youtube-source#226). Reative
    # junto com plugins.youtube.enabled e com defaultSearchPlatform em src/lib/lavalink.ts quando
    # confirmar que uma versão nova do plugin corrigiu a #226.
    youtubeSearchEnabled: false
    soundcloudSearchEnabled: true
  plugins:
    - dependency: 'dev.lavalink.youtube:youtube-plugin:1.18.2'
      snapshot: false
    - dependency: 'com.github.topi314.lavasrc:lavasrc-plugin:4.8.3'
      snapshot: false

plugins:
  lavasrc:
    # Fallback pra quando o SoundCloud não acha a faixa (comum em lançamentos recentes de
    # gravadoras grandes) — ver searchWithFallback em src/lib/search.ts, que só cai aqui
    # (prefixo "tdsearch:") depois de tentar o SoundCloud primeiro.
    #
    # tidal/deezer DESATIVADOS até TIDAL_TOKEN/DEEZER_ARL/DEEZER_MASTER_DECRYPTION_KEY serem
    # cadastradas no Coolify (ver DEPLOYMENT.md) — não há confirmação de que o plugin degrada bem
    # com essas credenciais vazias (pode falhar ao subir e derrubar o Lavalink inteiro, o que
    # quebraria SoundCloud/Bandcamp/Vimeo/Twitch junto). Ative os dois (`true`) só depois de
    # cadastrar as três env vars, redeploy, e conferir nos logs do Lavalink que subiu sem erro.
    sources:
      tidal: false
      # Deezer usado só como mirror de reprodução do Tidal (ver `providers` abaixo) — o Tidal
      # não tem fonte própria de streaming no Lavalink/Lavaplayer, só resolve metadados; o Deezer
      # é quem realmente entrega o áudio. Também funciona como fonte pesquisável direta (prefixo
      # "dzsearch:"), não só como mirror.
      deezer: false
      spotify: false
      applemusic: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    # Ordem de tentativa pra resolver áudio de uma faixa do Tidal (que só tem metadado, não
    # stream) — por ISRC primeiro (mais preciso), senão por busca de texto. Aponta pro Deezer,
    # não pro YouTube (desativado nesse node — ver plugins.youtube.enabled abaixo).
    providers:
      - 'dzisrc:%ISRC%'
      - 'dzsearch:%QUERY%'
    tidal:
      # Ajuste pro país da conta usada pra gerar o token abaixo — afeta o catálogo disponível.
      countryCode: 'BR'
      searchLimit: 6
      # token vem via env var PLUGINS_LAVASRC_TIDAL_TOKEN (Spring relaxed-binding, mesmo padrão
      # do OAuth do YouTube acima) — nunca hardcode aqui. Configurada em docker-compose.yml a
      # partir de TIDAL_TOKEN; cadastre o valor real direto no Coolify (Environment Variables),
      # nunca no repo. Veja DEPLOYMENT.md pra como obter o token.
    deezer:
      formats: ['MP3_256', 'MP3_128', 'MP3_64', 'AAC_64']
      # arl e masterDecryptionKey vêm via env vars PLUGINS_LAVASRC_DEEZER_ARL e
      # PLUGINS_LAVASRC_DEEZER_MASTERDECRYPTIONKEY (mesmo motivo do token do Tidal acima) —
      # nunca hardcode aqui. Configuradas em docker-compose.yml a partir de DEEZER_ARL e
      # DEEZER_MASTER_DECRYPTION_KEY.
  youtube:
    # Desativado: ver o comentário de youtubeSearchEnabled acima — não é problema de credencial
    # (OAuth renovava o token com sucesso nos logs), o carregamento da faixa em si que falha pra
    # todos os clients ao mesmo tempo. Até a #226 ser corrigida, o bot usa SoundCloud/Bandcamp/
    # Vimeo/Twitch (links diretos ou prefixo "scsearch:"/"ytsearch:" explícito na busca).
    enabled: false
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # Para uso pessoal autenticado com OAuth, priorizamos o client TV (único OAuth-compatível nesta
    # versão 1.18.2). Os demais clients (MUSIC, ANDROID_VR, etc.) ignoram o token OAuth e funcionam
    # como fallback para conteúdo público que não exige login, mas a ordem importa: o Lavalink tenta
    # na sequência até conseguir. TV primeiro maximiza o uso do OAuth em conteúdo restrito.
    clients:
      - TV
      - MUSIC
      - WEB
    # Requisições de busca vindas do IP do Hetzner são bloqueadas pelo YouTube ("Invalid status
    # code for search response: 400" / "sign in to confirm you're not a bot") — problema conhecido
    # e documentado para hosts de datacenter. OAuth (login com uma conta Google, burner, não a
    # principal — ver aviso do próprio plugin no log) contorna isso. O refresh token NÃO é lido
    # daqui via placeholder — essa seção de plugin não passa pela resolução `${...}` do Spring
    # (confirmado rodando em produção: o valor ficava literal e disparava o device-code flow de
    # novo a cada deploy). É passado direto como env var Spring-relaxed-binding
    # PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN no docker-compose.yml.
    oauth:
      enabled: true
    # YouTube muda o formato do player script com frequência, o que quebra a extração local da
    # função de assinatura ("Must find sig function from script..." nos logs — visto em produção
    # mesmo com OAuth funcionando e o client TV corretamente ativo). Delega essa extração pra um
    # servidor remoto mantido ativamente pelo autor do plugin, em vez de depender da lib local
    # ficar em dia com toda mudança do YouTube — ver github.com/kikkia/yt-cipher. Instância
    # pública, sem senha; o rate limit (10 req/s) é bem acima do que esse bot usa.
    remoteCipher:
      url: 'https://cipher.kikkia.dev/'
      userAgent: 'marola-beat'

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ''

logging:
  level:
    root: INFO
    lavalink: INFO
    # Sem isso, o prompt do device-code flow do OAuth (URL + código pra colar em
    # google.com/device) não aparece no log — é a única forma de completar o login.
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 5
