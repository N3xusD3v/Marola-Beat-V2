# Config do node Lavalink usado pelo bot (via lavalink-client). Só é acessível dentro da rede
# interna do Docker Compose — não expõe porta pro host, veja docker-compose.yml.
server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: '${LAVALINK_SERVER_PASSWORD}'
    sources:
      # YouTube é servido pelo plugin abaixo, não pela fonte nativa (removida do Lavalink 4
      # por causa de bloqueios de assinatura do próprio YouTube — ver plugins.youtube).
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: false
      local: false
    # bufferDurationMs mais alto que o padrão (400) dá mais margem contra picos de latência de
    # agendamento da CPU — o host roda vários outros stacks Docker além deste, então contenção de
    # CPU é esperada. opusEncodingQuality abaixo do máximo (10) reduz o custo de CPU por frame de
    # áudio codificado (perda de qualidade imperceptível nesse nível, já que a saída do Discord é
    # comprimida de qualquer forma). nonAllocatingFrameBuffer reduz alocações por frame, o que
    # reduz pressão de GC — outra fonte comum de stutter em áudio em tempo real.
    bufferDurationMs: 1000
    opusEncodingQuality: 8
    nonAllocatingFrameBuffer: true
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
  plugins:
    # 1.18.2 (release) quebrou o client TV em ~2026-08-18: YouTube rejeita User-Agents Cobalt
    # com "The page needs to be reloaded" (youtube-source#226). O PR #233 (UA PlayStation 4)
    # corrigiu isso e já está em main; ainda sem release semver — usamos o snapshot do commit
    # f45bbb7a (inclui #233 + #235). Trocar pra release estável assim que 1.18.3+ sair.
    # Formato oficial: https://github.com/lavalink-devs/youtube-source#plugin
    - dependency: 'dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3'
      repository: 'https://maven.lavalink.dev/snapshots'
      snapshot: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # TV primeiro: único client OAuth-compatível (youtube-source "Available clients"). Sem ele,
    # o token OAuth renova mas nunca é usado na reprodução ("This video requires login" em IP
    # de datacenter). MUSIC/WEB etc. ficam como fallback pra metadados/busca pública.
    clients:
      - TV
      - MUSIC
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
    # Requisições de busca vindas do IP do Hetzner são bloqueadas pelo YouTube ("Invalid status
    # code for search response: 400" / "sign in to confirm you're not a bot") — problema conhecido
    # e documentado para hosts de datacenter. OAuth (login com uma conta Google, burner, não a
    # principal — ver aviso do próprio plugin no log) contorna isso. O refresh token NÃO é lido
    # daqui via placeholder — essa seção de plugin não passa pela resolução `${...}` do Spring
    # (confirmado rodando em produção: o valor ficava literal e disparava o device-code flow de
    # novo a cada deploy). É passado direto como env var Spring-relaxed-binding
    # PLUGINS_YOUTUBE_OAUTH_REFRESHTOKEN no docker-compose.yml.
    oauth:
      enabled: true
    # YouTube muda o formato do player script com frequência, o que quebra a extração local da
    # função de assinatura ("Must find sig function from script..." nos logs — visto em produção
    # mesmo com OAuth funcionando e o client TV corretamente ativo). Delega essa extração pra um
    # servidor remoto mantido ativamente pelo autor do plugin, em vez de depender da lib local
    # ficar em dia com toda mudança do YouTube — ver github.com/kikkia/yt-cipher. Instância
    # pública, sem senha; o rate limit (10 req/s) é bem acima do que esse bot usa.
    remoteCipher:
      url: 'https://cipher.kikkia.dev/'
      userAgent: 'marola-beat'

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ''

logging:
  level:
    root: INFO
    lavalink: INFO
    # Sem isso, o prompt do device-code flow do OAuth (URL + código pra colar em
    # google.com/device) não aparece no log — é a única forma de completar o login.
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
  logback:
    rollingpolicy:
      max-file-size: 50MB
      max-history: 5
